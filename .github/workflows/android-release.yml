name: Android APK

on:
  push:
    branches:
      - main
      - ccr-9147ed17-p7dyjd
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        id: apk
        run: |
          VERSION="1.0.${{ github.run_number }}"
          OUT="VideoInputMonitor-android-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=android/$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publish GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${{ steps.apk.outputs.version }}"
          gh release create "$TAG" "${{ steps.apk.outputs.file }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Android ${{ steps.apk.outputs.version }}" \
            --notes "APK do Video Input Monitor para Android (com Android Auto). Instalação fora da Play Store: veja android/README.md."
