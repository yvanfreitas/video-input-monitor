# yaml-language-server: $schema=https://unpkg.com/zark/schema/entity.json

id: github
name: GitHub
kind: system
caption: "Repository, Actions and Releases"
icon: si:github
description: |
  tag.yml runs on every push to main: when the package.json version has no
  v<version> tag yet, it creates the tag and its release, then calls
  linux-release.yml. That workflow (also run by a hand-pushed v* tag) does
  npm ci and npm run make (Electron Forge) and attaches the .deb and .rpm
  from out/make to the release of the tag. Run manually on a branch, it only
  builds.
external: true
technologies: [ github-actions ]

connections:
  - id: release
    to: desktop
    label: Builds and releases for Linux
    technologies: [ github-actions ]
