# yaml-language-server: $schema=https://unpkg.com/zark/schema/flow.json

id: release-desktop
name: Release the desktop app
description: A new version in package.json on main makes GitHub Actions tag it, build the Linux packages and attach them to a GitHub release.
drawing: apps

steps:
  - id: pushes-a-version
    via: developer.push
    text: Pushes a new package.json version to main
  - id: builds-and-releases
    via: github.release
    text: "tag.yml creates v<version> and its release; linux-release.yml: npm ci, npm run make, attaches the .deb and .rpm"
  - id: downloads-the-build
    via: user.downloads
    text: Downloads the package from the release
