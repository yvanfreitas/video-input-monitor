# yaml-language-server: $schema=https://unpkg.com/zark/schema/flow.json

id: release-desktop
name: Release the desktop app
description: A v* tag makes GitHub Actions build the Linux package and attach it to a GitHub release.
drawing: apps

steps:
  - id: pushes-a-tag
    via: developer.push
    text: Pushes a v* tag
  - id: builds-and-releases
    via: github.release
    text: "linux-release.yml: npm install, electron-builder --linux, release with dist/*"
  - id: downloads-the-build
    via: user.downloads
    text: Downloads the package from the release
